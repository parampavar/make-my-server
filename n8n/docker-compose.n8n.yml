networks:
  n8n-internal: {}

services:
  n8n:
    image: 'docker.n8n.io/n8nio/n8n:${N8N_IMAGE_VERSION:-stable}'
    depends_on:
      n8n-db:
        condition: 'service_healthy'
    environment:
      # https://docs.n8n.io/hosting/configuration/environment-variables/database/
      DB_POSTGRESDB_DATABASE: '${N8N_POSTGRES_DATABASE:-n8n}'
      DB_POSTGRESDB_HOST: 'n8n-db'
      DB_POSTGRESDB_PASSWORD: '${N8N_POSTGRES_PASSWORD:-n8n}'
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_SCHEMA: '${N8N_POSTGRES_SCHEMA:-public}'
      DB_POSTGRESDB_USER: '${N8N_POSTGRES_USER:-n8n}'
      DB_TYPE: 'postgresdb'
      # https://docs.n8n.io/hosting/configuration/configuration-examples/time-zone/
      GENERIC_TIMEZONE: '${TZ:-Europe/Paris}'
      TZ: '${TZ:-Europe/Paris}'
      # https://docs.n8n.io/hosting/configuration/configuration-examples/webhook-url/
      N8N_EDITOR_BASE_URL: 'https://n8n.${SITE:-localhost}/'
      N8N_HOST: 'n8n.${SITE:-localhost}'
      N8N_PORT: 5678
      N8N_PROTOCOL: 'https'
      N8N_PROXY_HOPS: 1
      WEBHOOK_URL: 'https://n8n.${SITE:-localhost}/'
      # https://docs.n8n.io/hosting/configuration/task-runners/
      N8N_RUNNERS_AUTH_TOKEN: '${N8N_RUNNERS_AUTH_TOKEN:?set token}'
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: '0.0.0.0'
      N8N_RUNNERS_MODE: 'external'
      # https://docs.n8n.io/hosting/scaling/execution-data/
      EXECUTIONS_DATA_MAX_AGE: '${N8N_EXECUTIONS_DATA_MAX_AGE:-336}'
      EXECUTIONS_DATA_PRUNE: '${N8N_EXECUTIONS_DATA_PRUNE:-true}'
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: '${N8N_EXECUTIONS_DATA_PRUNE_MAX_COUNT:-50000}'
      # https://docs.n8n.io/hosting/configuration/environment-variables/security/
      N8N_BLOCK_ENV_ACCESS_IN_NODE: '${N8N_BLOCK_ENV_ACCESS_IN_NODE:-true}'
      N8N_DIAGNOSTICS_ENABLED: '${N8N_DIAGNOSTICS_ENABLED:-false}'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_RESTRICT_FILE_ACCESS_TO: '${N8N_RESTRICT_FILE_ACCESS_TO:-/files}'
      NODE_ENV: 'production'
    healthcheck:
      test: ['CMD',
             'wget', '-q', '--spider', '--proxy=off',
             'localhost:5678/healthz']
    labels:
      traefik.enable: true
      traefik.http.middlewares.header-n8n.headers.browserXssFilter: true
      traefik.http.middlewares.header-n8n.headers.contentTypeNosniff: true
      traefik.http.middlewares.header-n8n.headers.forceSTSHeader: true
      traefik.http.middlewares.header-n8n.headers.stsIncludeSubdomains: true
      traefik.http.middlewares.header-n8n.headers.stsPreload: true
      traefik.http.middlewares.header-n8n.headers.stsSeconds: 31536000
      traefik.http.routers.n8n.middlewares: 'header-n8n'
      traefik.http.routers.n8n.rule: 'Host(`n8n.${SITE:-localhost}`)'
      traefik.http.services.n8n.loadbalancer.server.port: 5678
    networks:
      - 'n8n-internal'
      - 'srv'
    restart: 'always'
    volumes:
      - 'n8n-data:/home/node/.n8n'
      - './files:/files'

  n8n-db:
    image: 'postgres:${N8N_POSTGRES_IMAGE_VERSION:-16-alpine}'
    environment:
      POSTGRES_DB: '${N8N_POSTGRES_DATABASE:-n8n}'
      POSTGRES_PASSWORD: '${N8N_POSTGRES_PASSWORD:-n8n}'
      POSTGRES_USER: '${N8N_POSTGRES_USER:-n8n}'
    healthcheck:
      test: ['CMD',
             'pg_isready', '-U', '${N8N_POSTGRES_USER:-n8n}',
             '-d', '${N8N_POSTGRES_DATABASE:-n8n}']
    labels:
      traefik.enable: false
    networks:
      - 'n8n-internal'
    restart: 'always'
    volumes:
      - './db:/var/lib/postgresql/data'

  n8n-runner:
    image: 'n8nio/runners:${N8N_IMAGE_VERSION:-stable}'
    depends_on:
      n8n:
        condition: 'service_healthy'
    environment:
      N8N_RUNNERS_AUTH_TOKEN: '${N8N_RUNNERS_AUTH_TOKEN:?set token}'
      N8N_RUNNERS_TASK_BROKER_URI: 'http://n8n:5679'
      TZ: '${TZ:-Europe/Paris}'
    labels:
      traefik.enable: false
    networks:
      - 'n8n-internal'
    read_only: true
    restart: 'always'
    tmpfs:
      - '/tmp'
    user: '65532:65532'
    volumes:
      - './files:/files'

volumes:
  n8n-data: {}
